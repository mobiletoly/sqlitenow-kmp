#Gradle
# heap and larger metaspace for the Gradle Daemon
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
# Match the Gradle daemon heap so production Wasm compilation has enough headroom.
kotlin.daemon.jvmargs=-Xmx4g

#org.gradle.caching=true
#Kotlin
kotlin.code.style=official
#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

sqlitenow.group=dev.goquick.sqlitenow
sqlitenow.version=0.18.0-SNAPSHOT

# Suppress noisy KGP warning triggered by AGP 9 / KMP integration (KT-61127).
kotlin.suppressGradlePluginWarnings=DeprecatedWarningGradleProperties

# Temporary disable configuration cache
org.gradle.configuration-cache=false

# Ensure Kotlin JS/Wasm tasks use webpack 5 (needed for async WASM)
kotlin.js.webpack.major.version=5

# Allow experimental Compose macOS targets used by the oversqlite platform harness.
org.jetbrains.compose.experimental.macos.enabled=true
